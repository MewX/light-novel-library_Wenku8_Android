// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlinVersion = '2.4.21'
    ext.kspVersion = '2.3.14'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${kotlinVersion}"
        classpath "org.jetbrains.kotlin:kotlin-serialization:${kotlinVersion}"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:${kspVersion}"
        classpath 'com.google.gms:google-services:4.6.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

ext {
    compileSdkVersion = 37
    compileSdkMinorVersion = 2
    targetSdkVersion = 37
    buildToolsVersion = "37.0.0"
    minSdkVersion = 24  // Material 3 Expressive requires minSdk 24 (Android 7.0 Nougat).
}

