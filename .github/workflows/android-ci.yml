name: Android CI

# The pull_request trigger is deliberately unfiltered. It used to be limited to PRs based on
# master, but development lands on the release branch (v1.30) first and only reaches master at
# release time -- so a PR into v1.30 ran no checks at all and the post-merge push to v1.30 was
# the first build of the change. That is the wrong order when the app cannot be built without
# an Android SDK: contributors working without one (or in a sandbox that cannot reach
# dl.google.com) have no local check either, which leaves nothing between an unbuilt commit and
# the release branch.
on:
  push:
    branches: [ "master", "v*" ]
  pull_request:

defaults:
  run:
    working-directory: ./studio-android/LightNovelLibrary

jobs:
  # Split out from the emulator job deliberately. These two run independently so that an
  # emulator that will not boot costs the 65 instrumented tests rather than all 164: previously
  # a single step ran assembleAlpha, the JVM tests and the instrumented tests together, so an
  # emulator failure meant the JVM tests never reported at all.
  build-and-test:
    name: Build and JVM unit tests
    runs-on: ubuntu-latest

    steps:
    # Deliberately no `submodules:` -- api/ is private, so CI falls back to api-stub
    # via the check in settings.gradle.
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and run JVM unit tests
      run: ./gradlew assembleAlpha testAlphaDebugUnitTest

    - name: Upload unit test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: studio-android/LightNovelLibrary/app/build/reports/tests/
        if-no-files-found: ignore

  instrumented-test:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest

    steps:
    # Deliberately no `submodules:` -- api/ is private, so CI falls back to api-stub
    # via the check in settings.gradle.
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Required on ubuntu-latest, and the likely cause of the earlier failure. Without it the
    # emulator silently falls back to software emulation, and `pm install` of a debug APK this
    # size (Firebase + play-services-ads) runs long enough that ddmlib gives up with
    # ShellCommandUnresponsiveException during installCommit.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # API 33 rather than the app's minSdk of 21. Every Build.VERSION branch in the app targets
    # Q (29) or TIRAMISU (33) -- there are none for 21-22 -- so an API 21 emulator took the
    # uninteresting side of every conditional while being by far the slowest and flakiest image
    # to install onto. Neither remaining instrumented test is API-21-specific.
    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: google_apis
        profile: pixel_5
        working-directory: ./studio-android/LightNovelLibrary
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
        disable-animations: true
        # Screen preparation. The emulator boots to a lock screen, and a locked or dozing device
        # parks activities at STOPPED so ActivityScenario can never reach RESUMED -- every
        # lifecycle test then fails with "Activity never becomes requested state [RESUMED]" after
        # a 45-second timeout, which reads like the Activity failing to start rather than like an
        # unprepared device. `locksettings set-disabled true` works here because a fresh emulator
        # has no secure lock; on a real device with a PIN it would not, which is why
        # ReaderRecreationTest asserts both conditions itself rather than assuming anyone ran
        # this. Waking once is not enough either: the Gradle line below spends minutes assembling
        # before it installs anything, so the screen is pinned on for the life of the job.
        #
        # Worth knowing what this is NOT for. These lines were added while chasing a red build
        # that turned out to be `UnsupportedOperationException: stub` -- CI builds against
        # api-stub, and two methods on the Activity startup path threw. Screen state was never
        # the cause. They stay because a fresh emulator genuinely does boot locked, but if this
        # job goes red again, read the log before assuming it is the device: reproduce what CI
        # builds with `./gradlew -DforceApiStub ...` locally. See "Device setup traps" in
        # STABILITY_PLAN.md. The echo below exists so the next failure is diagnosable from the
        # log alone rather than inferred from step durations.
        script: |
          adb shell svc power stayon true || true
          adb shell settings put system screen_off_timeout 2147483647 || true
          adb shell locksettings set-disabled true || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          echo "--- device state before tests ---"
          adb shell dumpsys power | grep -E "mWakefulness=" || true
          adb shell dumpsys window | grep -iE "isKeyguardShowing" || true
          ./gradlew connectedAlphaDebugAndroidTest

    - name: Upload instrumented test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-results
        path: studio-android/LightNovelLibrary/app/build/reports/androidTests/
        if-no-files-found: ignore
