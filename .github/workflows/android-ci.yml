name: Android CI

# The pull_request trigger is deliberately unfiltered. It used to be limited to PRs based on
# master, but development lands on the release branch (e.g. v2.0) first and only reaches master at
# release time -- so a PR into a release branch ran no checks at all and the post-merge push was
# the first build of the change.
on:
  push:
    branches: [ "master", "v*" ]
  pull_request:

defaults:
  run:
    working-directory: ./studio-android/LightNovelLibrary

jobs:
  # Split out from the emulator job deliberately so JVM unit tests & release R8 verification report
  # independently of emulator boot health.
  build-and-test:
    name: Build and JVM unit tests (:app-v2 & :app-v1)
    runs-on: ubuntu-latest

    steps:
    # Deliberately no `submodules:` -- api/ is private, so CI falls back to api-stub
    # via the check in settings.gradle.
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Run JVM + Robolectric Compose unit tests and generate JaCoCo XML reports for both :app-v2 and
    # :app-v1 first (before R8 release minification) with bounded daemon heaps so Gradle + Kotlin
    # daemon + forked Robolectric worker stay comfortably within ubuntu-latest's 7 GB RAM.
    - name: Run JVM unit tests and generate JaCoCo reports
      run: |
        ./gradlew -Dorg.gradle.jvmargs="-Xmx2560M -Dkotlin.daemon.jvm.options=-Xmx1536M" --max-workers=2 --stacktrace :app-v2:jacocoDefaultDebugUnitTestReport :app-v1:jacocoAlphaDebugUnitTestReport
        ./gradlew --stop

    # Stop the test-phase Gradle daemon above before switching heap size; otherwise Gradle leaves
    # the 2.5 GB daemon resident in RAM and spawns a second 3+ GB daemon alongside it, exhausting
    # ubuntu-latest's 7 GB RAM during :app-v2:packageDefaultDebug / R8 minification.
    - name: Assemble default (:app-v2) and alpha (:app-v1) debug & release APKs
      run: |
        ./gradlew -Dorg.gradle.jvmargs="-Xmx3072M -Dkotlin.daemon.jvm.options=-Xmx1536M" --max-workers=2 --stacktrace :app-v2:assembleDefault :app-v1:assembleAlpha
        ./gradlew --stop

    - name: Verify JVM coverage reports exist
      run: |
        for PAIR in "app-v2:jacocoDefaultDebugUnitTestReport" "app-v1:jacocoAlphaDebugUnitTestReport"; do
          MODULE="${PAIR%%:*}"
          TASK="${PAIR##*:}"
          XML="$MODULE/build/reports/jacoco/$TASK/$TASK.xml"
          if [ ! -s "$XML" ]; then
            echo "::error::No JVM coverage XML at $XML -- the report task was skipped or produced empty output."
            exit 1
          fi
          echo "--- $MODULE JVM report line counter ---"
          grep -o '<counter type="LINE"[^/]*/>' "$XML" | tail -1
        done

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: unit-test-results
        path: |
          studio-android/LightNovelLibrary/app-v2/build/reports/tests/
          studio-android/LightNovelLibrary/app-v1/build/reports/tests/
        if-no-files-found: ignore

    # Upload both :app-v2 and :app-v1 JVM coverage to Coveralls under distinct parallel flags, each
    # paired with its own module `base-path` so JaCoCo package paths (`org/mewx/wenku8/...` in
    # app-v2 and `org/mewx/wenku8/v1/...` in app-v1) resolve cleanly against the git tree.
    - name: Upload app-v2 JVM coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: studio-android/LightNovelLibrary/app-v2/build/reports/jacoco/jacocoDefaultDebugUnitTestReport/jacocoDefaultDebugUnitTestReport.xml
        format: jacoco
        base-path: studio-android/LightNovelLibrary/app-v2/src/main/java
        flag-name: jvm-v2
        parallel: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    - name: Upload app-v1 JVM coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: studio-android/LightNovelLibrary/app-v1/build/reports/jacoco/jacocoAlphaDebugUnitTestReport/jacocoAlphaDebugUnitTestReport.xml
        format: jacoco
        base-path: studio-android/LightNovelLibrary/app-v1/src/main/java
        flag-name: jvm
        parallel: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  instrumented-test:
    name: Instrumented tests (:app-v1 emulator)
    runs-on: ubuntu-latest

    steps:
    # Deliberately no `submodules:` -- api/ is private, so CI falls back to api-stub
    # via the check in settings.gradle.
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Required on ubuntu-latest so QEMU uses hardware acceleration rather than software emulation.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Scoped explicitly to `:app-v1` because both `:app-v2` (versionCode 100) and `:app-v1`
    # (versionCode 74) share production `applicationId "org.mewx.wenku8"`, and all `src/androidTest`
    # suites live in `:app-v1` (`:app-v2` runs its Compose UI suite via Robolectric in build-and-test).
    # Running unqualified `connectedAlphaDebugAndroidTest` would install both modules onto the same
    # emulator and collide on `INSTALL_FAILED_VERSION_DOWNGRADE`.
    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: google_apis
        profile: pixel_5
        working-directory: ./studio-android/LightNovelLibrary
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
        disable-animations: true
        script: |
          adb shell svc power stayon true || true
          adb shell settings put system screen_off_timeout 2147483647 || true
          adb shell locksettings set-disabled true || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          echo "--- device state before tests ---"
          adb shell dumpsys power | grep -E "mWakefulness=" || true
          adb shell dumpsys window | grep -iE "isKeyguardShowing" || true
          ./gradlew -Dorg.gradle.jvmargs="-Xmx2048M" --stacktrace :app-v1:connectedAlphaDebugAndroidTest :app-v1:jacocoAlphaDebugAndroidTestReport

    - name: Upload instrumented test report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: instrumented-test-results
        path: studio-android/LightNovelLibrary/app-v1/build/reports/androidTests/
        if-no-files-found: ignore

    - name: Verify instrumented coverage report exists
      run: |
        echo "--- .ec execution data found on disk ---"
        find app-v1/build/outputs -name '*.ec' -printf '%p (%s bytes)\n' 2>/dev/null || echo "NONE"
        XML=app-v1/build/reports/jacoco/jacocoAlphaDebugAndroidTestReport/jacocoAlphaDebugAndroidTestReport.xml
        if [ ! -s "$XML" ]; then
          echo "::error::No instrumented coverage XML at $XML -- the report task was skipped, which means no .ec files were found."
          exit 1
        fi
        echo "--- report line counter ---"
        grep -o '<counter type="LINE"[^/]*/>' "$XML" | tail -1

    - name: Upload instrumented coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: studio-android/LightNovelLibrary/app-v1/build/reports/jacoco/jacocoAlphaDebugAndroidTestReport/jacocoAlphaDebugAndroidTestReport.xml
        format: jacoco
        base-path: studio-android/LightNovelLibrary/app-v1/src/main/java
        flag-name: instrumented
        parallel: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  coverage-finish:
    name: Publish merged coverage
    needs: [ build-and-test, instrumented-test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Close the Coveralls parallel build
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
        carryforward: jvm,jvm-v2,instrumented
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
