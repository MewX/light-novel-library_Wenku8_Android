name: Android CI

# The pull_request trigger is deliberately unfiltered. It used to be limited to PRs based on
# master, but development lands on the release branch (e.g. v2.0) first and only reaches master at
# release time -- so a PR into a release branch ran no checks at all and the post-merge push was
# the first build of the change.
on:
  push:
    branches: [ "master", "v*" ]
  pull_request:

defaults:
  run:
    working-directory: ./studio-android/LightNovelLibrary

jobs:
  build-and-test:
    name: Build and JVM unit tests (:app-v2)
    runs-on: ubuntu-latest

    steps:
    # Deliberately no `submodules:` -- api/ is private, so CI falls back to api-stub
    # via the check in settings.gradle.
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Run JVM + Robolectric Compose unit tests for :app-v2 first (before R8 release minification)
    # with bounded daemon heaps so Gradle + Kotlin daemon + forked Robolectric worker stay
    # comfortably within ubuntu-latest's 7 GB RAM.
    - name: Run JVM unit tests and generate app-v2 JaCoCo report
      run: |
        ./gradlew -Dorg.gradle.jvmargs="-Xmx2560M -Dkotlin.daemon.jvm.options=-Xmx1536M" --max-workers=2 --stacktrace :app-v2:jacocoDefaultDebugUnitTestReport
        ./gradlew --stop

    # Stop the test-phase Gradle daemon above before switching heap size; otherwise Gradle leaves
    # the 2.5 GB daemon resident in RAM and spawns a second 3+ GB daemon alongside it, exhausting
    # ubuntu-latest's 7 GB RAM during :app-v2:packageDefaultDebug / R8 minification.
    - name: Assemble default (:app-v2) debug & release APKs
      run: |
        ./gradlew -Dorg.gradle.jvmargs="-Xmx3072M -Dkotlin.daemon.jvm.options=-Xmx1536M" --max-workers=2 --stacktrace :app-v2:assembleDefault
        ./gradlew --stop

    - name: Verify app-v2 JVM coverage report exists
      run: |
        XML="app-v2/build/reports/jacoco/jacocoDefaultDebugUnitTestReport/jacocoDefaultDebugUnitTestReport.xml"
        if [ ! -s "$XML" ]; then
          echo "::error::No JVM coverage XML at $XML -- the report task was skipped or produced empty output."
          exit 1
        fi
        echo "--- app-v2 JVM report line counter ---"
        grep -o '<counter type="LINE"[^/]*/>' "$XML" | tail -1

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: unit-test-results
        path: |
          studio-android/LightNovelLibrary/app-v2/build/reports/tests/
        if-no-files-found: ignore

    # Upload :app-v2 JVM coverage to Coveralls.
    # `base-path` maps JaCoCo package paths (`org/mewx/wenku8/...`) onto the git tree.
    - name: Upload app-v2 JVM coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: studio-android/LightNovelLibrary/app-v2/build/reports/jacoco/jacocoDefaultDebugUnitTestReport/jacocoDefaultDebugUnitTestReport.xml
        format: jacoco
        base-path: studio-android/LightNovelLibrary/app-v2/src/main/java
        flag-name: jvm-v2
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
